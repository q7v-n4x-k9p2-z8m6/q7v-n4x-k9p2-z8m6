<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="حساب صراف" />
    <title>حساب صراف</title>
    <script>
      // Restore GitHub Pages SPA routes and normalize malformed wildcard paths
      // before React Router starts. The literal "/**" is not an application route.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var spaPath = params.get('__spa_path');
          var current = new URL(window.location.href);
          var target = spaPath ? new URL(spaPath, window.location.origin) : current;

          // Accept only same-origin, absolute application paths.
          if (target.origin !== window.location.origin || !target.pathname.startsWith('/') || target.pathname.startsWith('//')) {
            return;
          }

          // A wildcard route pattern was incorrectly persisted as a browser URL.
          if (target.pathname === '/**' || target.pathname === '/**/') {
            target.pathname = '/';
          }

          if (spaPath || target.pathname !== current.pathname) {
            target.searchParams.delete('__spa_path');
            window.history.replaceState(null, '', target.pathname + target.search + target.hash);
          }
        } catch (error) {
          console.warn('Could not restore application route.');
        }
      })();
    </script>
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#101318;color:#f4edd8;font-family:Tahoma,Arial,sans-serif;text-align:center;line-height:2">

        <div style="font-size:16px">در حال آماده‌سازی برنامه...</div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
