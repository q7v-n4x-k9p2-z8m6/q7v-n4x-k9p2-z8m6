<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="پیش‌نمایش مستقل چیدمان حساب صراف" />
    <title>پیش‌نمایش حساب صراف</title>
    <script>
      // Preview-only route recovery; this branch is isolated from production.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var spaPath = params.get('__spa_path');
          var current = new URL(window.location.href);
          var target = spaPath ? new URL(spaPath, window.location.origin) : current;
          if (target.origin !== window.location.origin || !target.pathname.startsWith('/') || target.pathname.startsWith('//')) return;
          if (target.pathname === '/**' || target.pathname === '/**/') target.pathname = '/';
          if (spaPath || target.pathname !== current.pathname) {
            target.searchParams.delete('__spa_path');
            window.history.replaceState(null, '', target.pathname + target.search + target.hash);
          }
        } catch (error) {
          console.warn('Could not restore preview route.');
        }
      })();
    </script>
    <script>
      // DEMO ONLY: establish a local creator session so the responsive workspace can be viewed.
      // No real account, password, Supabase URL, or database key is used.
      (function () {
        try {
          localStorage.setItem('local_test_mode', 'true');
          localStorage.setItem('auth_token', 'local_token_preview_only');
          localStorage.setItem('auth_user', JSON.stringify({
            id: 'preview-user',
            role: 'creator',
            full_name: 'کاربر نمایشی',
            exchange_name: 'صرافی نمایشی',
            status: 'active'
          }));
        } catch (error) {
          console.warn('Preview session could not be initialized.');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#101318;color:#f4edd8;font-family:Tahoma,Arial,sans-serif;text-align:center;line-height:2">
      <div>
        <div style="font-size:24px;font-weight:700;margin-bottom:12px">حساب صراف — پیش‌نمایش</div>
        <div style="font-size:16px">در حال آماده‌سازی چیدمان نمایشی...</div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
