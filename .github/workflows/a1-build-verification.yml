name: A1 build verification

on:
  push:
    branches:
      - fix/a1-auth-loading-timeout
      - release/restore-build
      - feature/demo-qa-tenant
  pull_request:
    branches:
      - release/restore-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Upload production bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: a1-version21-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
