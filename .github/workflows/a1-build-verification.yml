name: A1 build verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Check Version 21 safety invariants
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const workspace = fs.readFileSync('src/components/sarraaf/Version21Workspace.jsx', 'utf8');
          const adapter = fs.readFileSync('src/components/sarraaf/Version21WriteAdapter.js', 'utf8');
          const data = fs.readFileSync('src/components/sarraaf/Version21DataAdapter.js', 'utf8');
          const demo = fs.readFileSync('src/components/sarraaf/Version21DemoAdapter.js', 'utf8');
          const checks = [
            [!workspace.includes('\\${'), 'Workspace contains a literal escaped JSX expression'],
            [adapter.includes('validateBalancedLines'), 'Financial posting/edit balance validation is missing'],
            [adapter.includes('Number.isFinite(parsed) ? parsed : Number.NaN'), 'Malformed numeric input must not be coerced to zero'],
            [data.includes('Number(line.debit)') && data.includes('Number(line.credit)'), 'Ledger balance checks must parse raw numeric values'],
            [adapter.includes('fee_currency: draft.currency || \'AFN\', total: amount + feeAmount'), 'Remittance edit must synchronize fee currency and total'],
            [adapter.includes('requireModulePermission'), 'Server-verified employee permission checks are missing'],
            [!adapter.includes('.delete()'), 'Physical delete call found in financial write adapter'],
            [data.includes(".eq('exchange_code', exchangeCode)"), 'Tenant scoping filter is missing'],
            [data.includes("from('user_permissions')"), 'Current-user permission loading is missing'],
            [data.includes('isDocumentBalanced'), 'Document balance status detection is missing'],
            [adapter.includes('assertDocumentBalancedForReversal'), 'Unbalanced-document reversal guard is missing'],
            [adapter.includes('MASTER_RECORD_DEACTIVATION') && adapter.includes('deactivateVersion21MasterRecord'), 'Master records must use safe deactivation instead of physical deletion'],
            [adapter.includes(".eq('exchange_code', ctx.exchangeCode).eq('id', Number(record.id))") && adapter.includes('.update(config.patch)'), 'Master record deactivation must be tenant-scoped'],
            [workspace.includes('deactivateVersion21MasterRecord') && workspace.includes('غیرفعال‌سازی انتخاب‌شده'), 'Workspace must label master record action as deactivation'],
            [fs.readFileSync('src/components/sarraaf/Version21Layout.jsx', 'utf8').includes('getFeatureStatus') && fs.readFileSync('src/components/sarraaf/Version21Layout.jsx', 'utf8').includes('MODULE_FEATURE_KEYS'), 'Navigation and route feature status must use the shared feature catalog'],
            [fs.readFileSync('src/components/sarraaf/Version21Layout.jsx', 'utf8').includes("documents: 'document_center'"), 'Document center navigation must use the canonical feature key'],
            [adapter.includes("&& !['remittance', 'exchange'].includes(module)"), 'Linked transfer and conversion reversals must process all related documents'],
            [adapter.includes('p_fee: 0'), 'Transfer fee must be posted as a separate balanced document'],
            [workspace.includes('accountingStatus'), 'Accounting status is not displayed in workspace tables'],
            [workspace.includes('const readOnly=false'), 'Version 21 CRUD UI must remain available to real exchange tenants'],
            [workspace.includes('saveDemoPreviewRecord(mod,payload'), 'Demo workspace writes must use isolated temporary storage'],
            [adapter.includes('assertNotDemoCoreWrite(ctx'), 'Core Version 21 writes must reject only the shared demo account'],
            [data.includes('loadDemoPreviewRecords') && data.includes('isDemoAccount'), 'Demo records must load only for the exact demo session'],
            [demo.includes("record_kind', 'temporary'") && demo.includes('expires_at'), 'Temporary demo records must have a bounded expiry'],
            [demo.includes("row.record_kind === 'sample'"), 'Fixed demo samples must be distinguished from temporary records'],
            [workspace.includes('data.isDemoAccount&&!target._demoPreview'), 'Demo delete must never touch existing core accounting records'],
            [workspace.includes('data.isDemoAccount&&!selected._demoPreview'), 'Demo edit must never touch existing core accounting records'],
            [demo.includes(".eq('record_kind', 'temporary')") && demo.includes(".eq('owner_user_id', ctx.userId)"), 'Demo mutations must be tenant-scoped and temporary-only'],
            [demo.includes("114: { username: '33333333', exchangeCode: 'EX-261028-27497E95' }"), 'Second test sarraaf account must use its own isolated demo tenant'],
            [adapter.includes("[114, { username: '33333333', exchangeCode: 'EX-261028-27497E95' }]"), 'Second test sarraaf account must be blocked from core financial writes'],
            [data.includes("Number(userId) === 114 && exchangeCode === 'EX-261028-27497E95'"), 'Second test sarraaf account must load only its isolated preview records'],
            [workspace.includes("['status','active','accountingStatus'].includes(column.key)"), 'Regular sarraaf lists must hide internal status flags'],
            [workspace.includes("label:'حساب بدهکار'") && workspace.includes("label:'حساب بستانکار'"), 'Operation lists must show debit and credit account details'],
            [workspace.includes("label:'شماره حواله'") && workspace.includes("label:'شماره سند'"), 'Operation lists must show transfer and document numbers'],
            [data.includes("row.direction === 'send' ? 'ارسالی' : 'نامعلوم'"), 'Unknown remittance direction must never be displayed as outgoing'],
            [adapter.includes('حواله نامشخص نباید به‌صورت خودکار ارسالی اصلاح شود'), 'Unknown remittance direction must be rejected during edits'],
            [workspace.includes("label:'مبدأ'") && workspace.includes("label:'مقصد'"), 'Remittance lists must show origin and destination separately'],
          ];
          for (const [ok, message] of checks) {
            if (!ok) throw new Error(message);
            console.log('PASS:', message);
          }
          NODE
      - name: Upload production bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: a1-version21-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
