name: Build isolated Sarraaf panel sandbox (no deployment)
on:
  push:
    branches:
      - preview/sarraaf-panel-isolated-20261118
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sarraaf-panel-isolated-sandbox
  cancel-in-progress: true
jobs:
  build-sandbox-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this sandbox branch only
        uses: actions/checkout@v4
        with:
          ref: preview/sarraaf-panel-isolated-20261118
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build main app and isolated sandbox page
        run: npm run build
      - name: Upload build artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: sarraaf-panel-isolated-sandbox
          path: dist/
          if-no-files-found: error
          retention-days: 7
