name: Deploy production web app
# Production deploy is intentionally manual during the main-branch consolidation.
# The canonical application source and CNAME are both read from main.

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type yes to publish the current main branch to the public domain"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ inputs.confirm_production == 'yes' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the canonical main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download pinned Persian Piper runtime and model
        run: |
          set -euo pipefail
          mkdir -p public/tts
          BASE="https://raw.githubusercontent.com/gyroing/Persian-Piper-TTS-WebAssembly/41cac5dc65e397358465857bb309666a83db63a8"
          for FILE in sherpa-onnx.js sherpa-onnx-wasm-main.js sherpa-onnx-wasm-main.wasm sherpa-onnx-wasm-main.data; do
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 "$BASE/$FILE" -o "public/tts/$FILE"
          done
          test -s public/tts/sherpa-onnx-wasm-main.data

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the website
        run: npm run build

      - name: Preserve the configured custom domain
        run: |
          test -s CNAME
          cp CNAME dist/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Publish production website
        id: deployment
        uses: actions/deploy-pages@v4
