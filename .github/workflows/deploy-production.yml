name: Deploy production web app
# The only production source is this repository's main branch.
# No other branch is checked out or published by this workflow.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type yes to publish the current main branch to the public domain"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.confirm_production == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the canonical main branch only
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch latest official exchange rates from Da Afghanistan Bank
        run: python3 scripts/fetch-dab-rates.py

      - name: Build the website
        run: npm run build

      - name: Preserve the configured custom domain
        run: |
          test -s CNAME
          cp CNAME dist/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Publish production website
        id: deployment
        uses: actions/deploy-pages@v4
